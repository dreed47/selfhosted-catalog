name: selfhosted-catalog

services:
  app:
    build: .
    container_name: ${CONTAINER_NAME:-selfhosted-catalog}
    env_file:
      - .env
    ports:
      - "${APP_PORT:-5010}:5010"
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: ${MEMORY_LIMIT:-384m}
          cpus: '${CPU_LIMIT:-0.5}'
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
