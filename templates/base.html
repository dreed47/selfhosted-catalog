<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Selfhosted{% endblock %}</title>
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/app.css?v=4">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 16 16">
      <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/>
    </symbol>
    <symbol id="i-fork" viewBox="0 0 16 16">
      <path d="M5 5.372v.878c0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75v-.878a2.25 2.25 0 1 1 1.5 0v.878a2.25 2.25 0 0 1-2.25 2.25h-1.5v2.128a2.251 2.251 0 1 1-1.5 0V8.5h-1.5A2.25 2.25 0 0 1 3.5 6.25v-.878a2.25 2.25 0 1 1 1.5 0ZM5 3.25a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm6.5 0a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Zm-3 8.5a.75.75 0 1 0-1.5 0 .75.75 0 0 0 1.5 0Z"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 16 16">
      <path d="M9.6 1.2a.75.75 0 0 1 .2.8 5.5 5.5 0 0 0 4.2 7.3.75.75 0 0 1 .4 1.2A7 7 0 1 1 8.5.9a.75.75 0 0 1 1.1.3Z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 16 16">
      <path d="M8 1.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1A.75.75 0 0 1 8 1.25Zm0 10a3.25 3.25 0 1 0 0-6.5 3.25 3.25 0 0 0 0 6.5ZM2.5 8a.75.75 0 0 1 .75-.75h1a.75.75 0 0 1 0 1.5h-1A.75.75 0 0 1 2.5 8Zm9.25-.75a.75.75 0 0 0 0 1.5h1a.75.75 0 0 0 0-1.5h-1ZM8 12.25a.75.75 0 0 1 .75.75v1a.75.75 0 0 1-1.5 0v-1a.75.75 0 0 1 .75-.75ZM4.1 4.1a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 1 1-1.06 1.07l-.7-.71a.75.75 0 0 1 0-1.06Zm6.04 6.04a.75.75 0 0 1 1.06 0l.7.7a.75.75 0 0 1-1.06 1.07l-.7-.71a.75.75 0 0 1 0-1.06ZM11.2 4.1a.75.75 0 0 1 0 1.06l-.7.7a.75.75 0 1 1-1.07-1.06l.71-.7a.75.75 0 0 1 1.06 0ZM5.86 10.14a.75.75 0 0 1 0 1.06l-.7.7a.75.75 0 0 1-1.07-1.06l.71-.7a.75.75 0 0 1 1.06 0Z"/>
    </symbol>
  </svg>
  <header class="top">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true"></span>
      <span class="brand-text">
        <strong>Selfhosted</strong>
        <em>project catalog</em>
      </span>
    </a>
    <nav class="nav">
      <a href="/">Catalog</a>
      <a href="/weeks">Weeks</a>
      <a href="/logs">Log</a>
      <button type="button" class="theme" id="theme-toggle" aria-label="Switch color theme">
        <svg class="ico theme-moon" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="ico theme-sun" aria-hidden="true"><use href="#i-sun"/></svg>
        <span class="theme-label"></span>
      </button>
    </nav>
  </header>
  <div class="wrap">
    {% block body %}{% endblock %}
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var button = document.getElementById("theme-toggle");
      if (!button) return;
      function resolved() {
        if (root.dataset.theme === "light" || root.dataset.theme === "dark") return root.dataset.theme;
        return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function label() {
        var next = resolved() === "dark" ? "light" : "dark";
        button.setAttribute("aria-label", "Switch to " + next + " mode");
      }
      button.addEventListener("click", function () {
        var next = resolved() === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        var saved = "";
        try { saved = localStorage.getItem("theme") || ""; } catch (e) {}
        if (saved !== "light" && saved !== "dark") label();
      });
      label();
    })();
  </script>
</body>
</html>
